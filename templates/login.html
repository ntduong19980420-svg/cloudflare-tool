<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - MAS Proxy</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6fb; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 360px; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; color: #3b82f6; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .logo-box { background: #3b82f6; color: white; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #64748b; margin-bottom: 6px; font-weight: 500; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2563eb; }
        .error { color: #ef4444; font-size: 13px; margin-bottom: 15px; text-align: left; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <div class="logo-box">D</div> DMX Proxy
        </div>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" name="username" required placeholder="DMXProxy">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit">Đăng Nhập</button>
        </form>
    </div>
</body>
</html>
